<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Calculator</title>
</head>
<body>

    <main>
        <input class="inputOut" >
        <div class="box-numbers">
            <button class="insert" id="1">1</button>
            <button class="insert" id="2">2</button>
            <button class="insert" id="3">3</button>
            <button class="insert" id="plus">+</button>
            <br>
            <button class="insert" id="4">4</button>
            <button class="insert" id="5">5</button>
            <button class="insert" id="6">6</button>
            <button class="insert" id="minus">-</button>
            <br>
            <button class="insert" id="7">7</button>
            <button class="insert" id="8">8</button>
            <button class="insert" id="9">9</button>
            <button class="insert" id="times">x</button>
            <br>
            <button class="insert" id="comma">,</button>
            <button class="insert" id="0">0</button>
            <button class="insert" id="clear">C</button>
            <button class="insert" id="split">/</button>
            <br>
            <button class="result">=</button>
        </div>

    </main>
    
</body>
<script src="./script.js"></script>
</html>
