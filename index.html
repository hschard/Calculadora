<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Calculator</title>
</head>
<body>

    <main>
        <input class="inputOut" >
        <div class="box-numbers">
            <button class="insert" onclick="key1()">1</button>
            <button class="insert" onclick="key2()">2</button>
            <button class="insert" onclick="key3()">3</button>
            <button id="plus" onclick="sum()">+</button>
            <br>
            <button class="insert" onclick="key4()">4</button>
            <button class="insert" onclick="key5()">5</button>
            <button class="insert" onclick="key6()">6</button>
            <button id="minus" onclick="sub()">-</button>
            <br>
            <button class="insert" onclick="key7()">7</button>
            <button class="insert" onclick="key8()">8</button>
            <button class="insert" onclick="key9()">9</button>
            <button id="times" onclick="multi()">x</button>
            <br>
            <button class="insert" onclick="keyComma()">,</button>
            <button class="insert" onclick="key0()" >0</button>
            <button class="insert" onclick="clearOut()">C</button>
            <button id="split" onclick="div()">/</button>
            <br>
            <button class="result">=</button>
        </div>

    </main>
    
</body>
<script src="./script.js"></script>
</html>
